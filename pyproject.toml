[project]
name = "quote-core"
version = "0.1.0"
description = "Laser cutting price calculation module"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ezdxf>=1.1.0",
]

[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]